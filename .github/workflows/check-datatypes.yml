# The datatypes' decoder cores on the host (x86), under AddressSanitizer and
# UBSan: gfopentga.datatype's (Datatypes/tests/test-tga.sh) and cdxl.datatype's
# (Datatypes/tests/test-cdxl.sh, with ffmpeg's own CDXL decoder as a check),
# webm.datatype's picture sizes against crafted headers
# (Datatypes/tests/test-webm.sh),
# and stream.datatype's with gzip.datatype's and brotli.datatype's
# (Datatypes/tests/test-stream.sh), and gfopenpng.datatype's PNG writer
# (Datatypes/tests/test-pngenc.sh); and the datatypes' RomTag versions
# (Datatypes/tests/test-romtag.py); and webm.datatype's reader through its
# read cache (Datatypes/tests/test-webm-read.sh).
# GFOpenDatatypes' cores (datatypes.library and its eight class datatypes) under
# qemu-m68k with an m68k cross GCC; the datatypesclass test
# (tests/m68k/test_opendatatypes_class.sh) needs an amigachrome-guest
# checkout (GUEST=) and runs in amigachrome-guest's own CI.
# The bitplanes-to-pixels helper ilbm, picture and cdxl share
# (common/include/odt_planar.h) against the loop it replaced, on the host
# (Datatypes/tests/test-planar.sh).
# The Amiga builds need the os32-gcc16 stove and are made on the build PC.
name: Datatypes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg python3-pil
      - name: gfopentga.datatype decoder
        run: sh Datatypes/tests/test-tga.sh
      - name: cdxl.datatype core
        run: sh Datatypes/tests/test-cdxl.sh
      - name: webm.datatype picture sizes
        run: sh Datatypes/tests/test-webm.sh
      - name: stream.datatype with gzip and Brotli
        run: sh Datatypes/tests/test-stream.sh
      - name: webm.datatype's reader through its read cache
        run: sh Datatypes/tests/test-webm-read.sh
      - name: gfopenpng.datatype's PNG writer
        run: sh Datatypes/tests/test-pngenc.sh
      - name: the datatypes' RomTags carry their version
        run: python3 Datatypes/tests/test-romtag.py
      - name: bitplanes to pixels (common/include/odt_planar.h)
        run: sh Datatypes/tests/test-planar.sh
  m68k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: m68k cross GCC, G++ and qemu-m68k
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu g++-m68k-linux-gnu qemu-user
      - name: GFOpenDatatypes (datatypes.library) core
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_opendatatypes.sh
      - name: GFOpenDatatypes picture, ilbm, sound and 8svx datatype cores
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_opendatatypes_picsound.sh
      - name: GFOpenDatatypes text, ascii, animation and anim classes
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_opendatatypes_textanim.sh
